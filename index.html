<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HabitFlow">
<meta name="theme-color" content="#0d0d1a">
<title>HabitFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0d1a;
  --surface: #15152a;
  --surface2: #1e1e38;
  --border: rgba(255,255,255,0.08);
  --text: #f0f0ff;
  --muted: rgba(240,240,255,0.45);
  --cali-a: #4f8ef7;
  --cali-b: #7c3aed;
  --salsa-a: #f7316a;
  --salsa-b: #ff8c42;
  --green: #22d07a;
  --amber: #f59e0b;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--bg); font-family: 'DM Sans', sans-serif; color: var(--text); overflow: hidden; }

/* ── APP SHELL ── */
#app { height: 100vh; display: flex; flex-direction: column; max-width: 430px; margin: 0 auto; position: relative; overflow: hidden; }

/* ── SCREENS ── */
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; opacity: 0; pointer-events: none; transition: opacity 0.3s, transform 0.3s; transform: translateX(30px); }
.screen.active { opacity: 1; pointer-events: all; transform: translateX(0); }

/* ── HEADER ── */
.header { padding: 56px 24px 20px; flex-shrink: 0; }
.header-row { display: flex; align-items: center; justify-content: space-between; }
.app-title { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 28px; background: linear-gradient(90deg, #4f8ef7, #c084fc, #f7316a); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.streak-badge { display: flex; align-items: center; gap: 6px; background: rgba(245,158,11,0.15); border: 1px solid rgba(245,158,11,0.35); border-radius: 20px; padding: 6px 14px; }
.streak-fire { font-size: 16px; }
.streak-num { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 15px; color: var(--amber); }
.date-line { font-size: 13px; color: var(--muted); margin-top: 8px; }

/* ── SCROLL BODY ── */
.scroll { flex: 1; overflow-y: auto; padding: 0 20px 120px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; }

/* ── SECTION LABELS ── */
.section-label { font-size: 11px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin: 20px 0 10px; }

/* ── HABIT CARDS ── */
.habit-card { border-radius: 20px; padding: 16px; margin-bottom: 12px; border: 1px solid var(--border); position: relative; overflow: hidden; }
.habit-card::before { content: ''; position: absolute; inset: 0; opacity: 0.07; }
.card-cali::before { background: linear-gradient(135deg, var(--cali-a), var(--cali-b)); }
.card-salsa::before { background: linear-gradient(135deg, var(--salsa-a), var(--salsa-b)); }
.card-cali { background: rgba(79,142,247,0.06); border-color: rgba(79,142,247,0.2); }
.card-salsa { background: rgba(247,49,106,0.06); border-color: rgba(247,49,106,0.2); }

.card-top { display: flex; align-items: center; gap: 12px; }
.card-icon { width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
.icon-cali { background: rgba(79,142,247,0.18); }
.icon-salsa { background: rgba(247,49,106,0.18); }
.card-info { flex: 1; }
.card-name { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 17px; }
.card-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.card-check { width: 36px; height: 36px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.2); background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.25s; flex-shrink: 0; color: var(--muted); font-size: 16px; }
.card-check.done-cali { background: var(--cali-a); border-color: var(--cali-a); color: #fff; }
.card-check.done-salsa { background: var(--salsa-a); border-color: var(--salsa-a); color: #fff; }

/* ── STREAK WEEK ── */
.week-row { display: flex; gap: 4px; margin-top: 14px; }
.day-item { flex: 1; text-align: center; }
.day-label { font-size: 9px; color: var(--muted); text-transform: uppercase; }
.day-dot { width: 28px; height: 28px; border-radius: 50%; margin: 4px auto 0; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 500; }
.dot-done-cali { background: var(--cali-a); color: #fff; }
.dot-done-salsa { background: var(--salsa-a); color: #fff; }
.dot-today { border: 2px solid rgba(255,255,255,0.3); color: var(--muted); }
.dot-empty { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.15); }

/* ── LOG BUTTON ── */
.log-btn { width: 100%; margin-top: 14px; padding: 10px; border-radius: 12px; border: 1px dashed rgba(79,142,247,0.4); background: rgba(79,142,247,0.06); color: var(--cali-a); font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.2s; }
.log-btn:active { opacity: 0.7; transform: scale(0.98); }

/* ── BOTTOM NAV ── */
.bottom-nav { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(13,13,26,0.95); backdrop-filter: blur(20px); border-top: 1px solid var(--border); display: flex; padding: 8px 0 28px; max-width: 430px; margin: 0 auto; }
.nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px; cursor: pointer; transition: opacity 0.2s; }
.nav-icon { font-size: 22px; transition: transform 0.2s; }
.nav-item.active .nav-icon { transform: scale(1.15); }
.nav-label { font-size: 10px; font-weight: 500; color: var(--muted); }
.nav-item.active .nav-label { color: var(--text); }

/* ── MODAL / SHEET ── */
.sheet-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.6); opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 100; }
.sheet-overlay.open { opacity: 1; pointer-events: all; }
.sheet { position: absolute; bottom: 0; left: 0; right: 0; background: var(--surface); border-radius: 28px 28px 0 0; padding: 0 0 40px; transform: translateY(100%); transition: transform 0.35s cubic-bezier(.32,.72,0,1); max-height: 85vh; overflow-y: auto; }
.sheet-overlay.open .sheet { transform: translateY(0); }
.sheet-handle { width: 40px; height: 4px; background: rgba(255,255,255,0.15); border-radius: 2px; margin: 12px auto 20px; }
.sheet-title { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 20px; padding: 0 24px 16px; }
.exercise-block { margin: 0 20px 12px; background: var(--surface2); border-radius: 16px; padding: 14px 16px; }
.ex-name { font-size: 14px; font-weight: 500; margin-bottom: 10px; }
.ex-inputs { display: flex; gap: 8px; }
.ex-field { flex: 1; }
.ex-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 4px; }
.ex-input { width: 100%; padding: 8px 12px; background: rgba(255,255,255,0.06); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 15px; font-family: 'DM Sans', sans-serif; text-align: center; outline: none; }
.ex-input:focus { border-color: var(--cali-a); }
.save-btn { margin: 20px 20px 0; width: calc(100% - 40px); padding: 16px; background: linear-gradient(135deg, var(--cali-a), var(--cali-b)); border: none; border-radius: 16px; color: #fff; font-family: 'Syne', sans-serif; font-weight: 700; font-size: 16px; cursor: pointer; transition: opacity 0.2s, transform 0.15s; }
.save-btn:active { opacity: 0.85; transform: scale(0.98); }

/* ── PROGRESS SCREEN ── */
.progress-header { padding: 56px 24px 8px; }
.prog-title { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 24px; }
.prog-sub { font-size: 13px; color: var(--muted); margin-top: 4px; }

.chart-card { background: var(--surface); border-radius: 20px; padding: 20px; margin: 0 20px 16px; border: 1px solid var(--border); }
.chart-title { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 15px; margin-bottom: 4px; }
.chart-sub { font-size: 11px; color: var(--muted); margin-bottom: 16px; }
.chart-wrap { position: relative; height: 140px; }
.chart-svg { width: 100%; height: 100%; overflow: visible; }

/* ── STATS ROW ── */
.stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0 20px 12px; }
.stat-card { background: var(--surface); border-radius: 16px; padding: 14px 16px; border: 1px solid var(--border); }
.stat-val { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 26px; }
.stat-val.cali { color: var(--cali-a); }
.stat-val.salsa { color: var(--salsa-a); }
.stat-label { font-size: 11px; color: var(--muted); margin-top: 2px; }

/* ── PERSONAL BESTS ── */
.pb-card { background: var(--surface); border-radius: 20px; margin: 0 20px 16px; border: 1px solid var(--border); overflow: hidden; }
.pb-header { padding: 14px 16px 10px; background: rgba(79,142,247,0.06); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
.pb-header-title { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 14px; }
.pb-row { display: flex; align-items: center; padding: 10px 16px; border-bottom: 1px solid rgba(255,255,255,0.04); }
.pb-row:last-child { border-bottom: none; }
.pb-ex { font-size: 13px; flex: 1; }
.pb-val { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 14px; color: var(--cali-a); }
.pb-tag { font-size: 10px; color: var(--muted); margin-left: 6px; }

/* ── TOAST ── */
.toast { position: absolute; top: 60px; left: 50%; transform: translateX(-50%) translateY(-20px); background: var(--green); color: #fff; font-family: 'Syne', sans-serif; font-weight: 700; font-size: 14px; padding: 10px 22px; border-radius: 30px; opacity: 0; transition: all 0.3s; pointer-events: none; white-space: nowrap; z-index: 200; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── XP BAR ── */
.xp-section { margin: 0 20px 16px; }
.xp-top { display: flex; justify-content: space-between; margin-bottom: 6px; }
.xp-label-txt { font-size: 12px; color: var(--muted); }
.xp-level { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 13px; color: var(--amber); }
.xp-track { height: 8px; background: rgba(255,255,255,0.08); border-radius: 4px; overflow: hidden; }
.xp-fill { height: 100%; background: linear-gradient(90deg, var(--amber), #f7316a); border-radius: 4px; transition: width 0.6s ease; }

/* ── EMPTY STATE ── */
.empty-chart { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 120px; color: var(--muted); font-size: 13px; gap: 8px; }
.empty-icon { font-size: 28px; opacity: 0.5; }
</style>
</head>
<body>
<div id="app">

  <!-- ═══ HOME SCREEN ═══ -->
  <div class="screen active" id="screen-home">
    <div class="header">
      <div class="header-row">
        <div class="app-title">HabitFlow</div>
        <div class="streak-badge">
          <span class="streak-fire">🔥</span>
          <span class="streak-num" id="total-streak">0</span>
        </div>
      </div>
      <div class="date-line" id="date-line"></div>
    </div>

    <div class="scroll">
      <!-- XP Bar -->
      <div class="xp-section">
        <div class="xp-top">
          <span class="xp-label-txt" id="xp-label">XP: 0 / 100</span>
          <span class="xp-level" id="level-label">Level 1</span>
        </div>
        <div class="xp-track"><div class="xp-fill" id="xp-fill" style="width:0%"></div></div>
      </div>

      <!-- CALISTHENICS -->
      <div class="section-label">💪 Calisthenics</div>
      <div class="habit-card card-cali">
        <div class="card-top">
          <div class="card-icon icon-cali">🏋️</div>
          <div class="card-info">
            <div class="card-name">Calisthenics</div>
            <div class="card-sub" id="cali-sub">Heute noch kein Training</div>
          </div>
          <div class="card-check" id="cali-check" onclick="toggleCali()">✓</div>
        </div>
        <!-- Week row -->
        <div class="week-row" id="cali-week"></div>
        <button class="log-btn" onclick="openSheet()">＋ Training eintragen</button>
      </div>

      <!-- SALSA -->
      <div class="section-label">💃 Salsa</div>
      <div class="habit-card card-salsa">
        <div class="card-top">
          <div class="card-icon icon-salsa">💃</div>
          <div class="card-info">
            <div class="card-name">Salsa</div>
            <div class="card-sub" id="salsa-sub">Heute noch nicht getanzt</div>
          </div>
          <div class="card-check" id="salsa-check" onclick="toggleSalsa()">✓</div>
        </div>
        <div class="week-row" id="salsa-week"></div>
      </div>
    </div>
  </div>

  <!-- ═══ PROGRESS SCREEN ═══ -->
  <div class="screen" id="screen-progress">
    <div class="progress-header">
      <div class="prog-title">Fortschritt 📈</div>
      <div class="prog-sub">Deine letzten 7 Tage</div>
    </div>
    <div class="scroll">
      <!-- Stats -->
      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-val cali" id="stat-cali-streak">0</div>
          <div class="stat-label">Cali Streak 🔥</div>
        </div>
        <div class="stat-card">
          <div class="stat-val salsa" id="stat-salsa-streak">0</div>
          <div class="stat-label">Salsa Streak 💃</div>
        </div>
      </div>

      <!-- Charts per exercise -->
      <div class="section-label" style="padding: 0 20px;">Übungs-Fortschritt</div>

      <div id="charts-container"></div>

      <!-- Personal Bests -->
      <div class="pb-card" id="pb-card">
        <div class="pb-header">
          <span style="font-size:16px;">🏆</span>
          <span class="pb-header-title">Persönliche Bestleistungen</span>
        </div>
        <div id="pb-rows"></div>
      </div>
    </div>
  </div>

  <!-- ═══ BOTTOM NAV ═══ -->
  <nav class="bottom-nav">
    <div class="nav-item active" id="nav-home" onclick="navigate('home')">
      <span class="nav-icon">🏠</span>
      <span class="nav-label">Heute</span>
    </div>
    <div class="nav-item" id="nav-progress" onclick="navigate('progress')">
      <span class="nav-icon">📊</span>
      <span class="nav-label">Fortschritt</span>
    </div>
  </nav>

  <!-- ═══ SHEET: Training Log ═══ -->
  <div class="sheet-overlay" id="sheet-overlay" onclick="closeSheetOutside(event)">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title">🏋️ Training eintragen</div>
      <div id="exercise-fields"></div>
      <button class="save-btn" onclick="saveTraining()">Training speichern ✓</button>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>
</div>

<script>
const EXERCISES = ['Muscle Ups', 'Klimmzüge', 'Dips', 'Bizeps-Klimmzüge'];
const DAYS_SHORT = ['Mo','Di','Mi','Do','Fr','Sa','So'];

// ─── STATE ───
function loadState() {
  try { return JSON.parse(localStorage.getItem('habitflow_v1') || 'null'); } catch(e) { return null; }
}
function getInitialState() {
  return { caliDays: {}, salsaDays: {}, logs: {}, totalXP: 0 };
}
let S = loadState() || getInitialState();
function save() { localStorage.setItem('habitflow_v1', JSON.stringify(S)); }

function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// ─── DATE DISPLAY ───
function formatDate() {
  const d = new Date();
  const opts = { weekday:'long', day:'numeric', month:'long' };
  return d.toLocaleDateString('de-DE', opts);
}

// ─── WEEK ROW ───
function buildWeek(container, doneMap, dotDoneClass) {
  const today = new Date();
  const dayOfWeek = today.getDay(); // 0=Sun
  const monday = new Date(today);
  const diff = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
  monday.setDate(today.getDate() + diff);

  container.innerHTML = '';
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const isToday = key === todayKey();
    const done = !!doneMap[key];
    const div = document.createElement('div');
    div.className = 'day-item';
    const dotClass = done ? dotDoneClass : (isToday ? 'dot-today' : 'dot-empty');
    div.innerHTML = `<div class="day-label">${DAYS_SHORT[i]}</div><div class="day-dot ${dotClass}">${done ? '✓' : (isToday ? '·' : '')}</div>`;
    container.appendChild(div);
  }
}

// ─── STREAK ───
function calcStreak(doneMap) {
  let streak = 0;
  const d = new Date();
  while (true) {
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    if (!doneMap[key]) break;
    streak++;
    d.setDate(d.getDate() - 1);
  }
  return streak;
}

// ─── XP ───
function calcLevel(xp) {
  const lvl = Math.floor(xp / 100) + 1;
  const pct = (xp % 100);
  return { lvl, pct };
}

// ─── RENDER HOME ───
function renderHome() {
  document.getElementById('date-line').textContent = formatDate();

  const today = todayKey();
  const caliDone = !!S.caliDays[today];
  const salsaDone = !!S.salsaDays[today];

  // Cali card
  const cc = document.getElementById('cali-check');
  cc.className = 'card-check' + (caliDone ? ' done-cali' : '');
  const todayLog = S.logs[today];
  if (caliDone && todayLog) {
    const totalSets = Object.values(todayLog).reduce((a, b) => a + (b.sets || 0), 0);
    document.getElementById('cali-sub').textContent = `${totalSets} Sets heute ✓`;
  } else {
    document.getElementById('cali-sub').textContent = 'Heute noch kein Training';
  }

  // Salsa card
  const sc = document.getElementById('salsa-check');
  sc.className = 'card-check' + (salsaDone ? ' done-salsa' : '');
  document.getElementById('salsa-sub').textContent = salsaDone ? 'Heute getanzt 💃' : 'Heute noch nicht getanzt';

  buildWeek(document.getElementById('cali-week'), S.caliDays, 'dot-done-cali');
  buildWeek(document.getElementById('salsa-week'), S.salsaDays, 'dot-done-salsa');

  // Streaks & XP
  const cs = calcStreak(S.caliDays);
  const ss = calcStreak(S.salsaDays);
  document.getElementById('total-streak').textContent = Math.max(cs, ss);

  const { lvl, pct } = calcLevel(S.totalXP || 0);
  document.getElementById('xp-label').textContent = `XP: ${S.totalXP % 100} / 100`;
  document.getElementById('level-label').textContent = `Level ${lvl}`;
  document.getElementById('xp-fill').style.width = pct + '%';
}

// ─── TOGGLE SALSA ───
function toggleSalsa() {
  const today = todayKey();
  if (S.salsaDays[today]) {
    delete S.salsaDays[today];
  } else {
    S.salsaDays[today] = true;
    S.totalXP = (S.totalXP || 0) + 15;
    showToast('💃 Salsa gemacht! +15 XP');
  }
  save();
  renderHome();
}

// ─── TOGGLE CALI (opens sheet if not done) ───
function toggleCali() {
  const today = todayKey();
  if (S.caliDays[today]) {
    delete S.caliDays[today];
    delete S.logs[today];
    save();
    renderHome();
  } else {
    openSheet();
  }
}

// ─── SHEET ───
function openSheet() {
  const today = todayKey();
  const existing = S.logs[today] || {};
  const container = document.getElementById('exercise-fields');
  container.innerHTML = '';
  EXERCISES.forEach(ex => {
    const prev = existing[ex] || {};
    container.innerHTML += `
      <div class="exercise-block">
        <div class="ex-name">💪 ${ex}</div>
        <div class="ex-inputs">
          <div class="ex-field">
            <div class="ex-label">Sets</div>
            <input class="ex-input" type="number" min="0" max="99" placeholder="0" id="sets-${ex}" value="${prev.sets || ''}">
          </div>
          <div class="ex-field">
            <div class="ex-label">Wiederh.</div>
            <input class="ex-input" type="number" min="0" max="99" placeholder="0" id="reps-${ex}" value="${prev.reps || ''}">
          </div>
        </div>
      </div>`;
  });
  document.getElementById('sheet-overlay').classList.add('open');
}

function closeSheet() {
  document.getElementById('sheet-overlay').classList.remove('open');
}
function closeSheetOutside(e) {
  if (e.target === document.getElementById('sheet-overlay')) closeSheet();
}

function saveTraining() {
  const today = todayKey();
  const log = {};
  let anyData = false;
  EXERCISES.forEach(ex => {
    const sets = parseInt(document.getElementById('sets-'+ex).value) || 0;
    const reps = parseInt(document.getElementById('reps-'+ex).value) || 0;
    log[ex] = { sets, reps };
    if (sets > 0 || reps > 0) anyData = true;
  });
  if (!anyData) { showToast('Bitte mindestens eine Übung eintragen!'); return; }
  S.logs[today] = log;
  if (!S.caliDays[today]) {
    S.caliDays[today] = true;
    S.totalXP = (S.totalXP || 0) + 25;
    showToast('🏋️ Training gespeichert! +25 XP 🔥');
  } else {
    showToast('Training aktualisiert ✓');
  }
  save();
  closeSheet();
  renderHome();
}

// ─── PROGRESS SCREEN ───
function renderProgress() {
  const cs = calcStreak(S.caliDays);
  const ss = calcStreak(S.salsaDays);
  document.getElementById('stat-cali-streak').textContent = cs;
  document.getElementById('stat-salsa-streak').textContent = ss;

  buildCharts();
  buildPBs();
}

function buildCharts() {
  const container = document.getElementById('charts-container');
  container.innerHTML = '';

  EXERCISES.forEach(ex => {
    // Get last 7 days of data for this exercise
    const points = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      const log = S.logs[key];
      const reps = (log && log[ex]) ? (log[ex].reps || 0) : 0;
      const sets = (log && log[ex]) ? (log[ex].sets || 0) : 0;
      points.push({ day: DAYS_SHORT[6-i], reps, sets, key });
    }

    const hasData = points.some(p => p.reps > 0);
    const card = document.createElement('div');
    card.className = 'chart-card';
    card.style.margin = '0 20px 12px';

    const maxReps = Math.max(...points.map(p => p.reps), 1);

    let chartContent = '';
    if (!hasData) {
      chartContent = `<div class="empty-chart"><div class="empty-icon">📭</div><div>Noch keine Daten für ${ex}</div></div>`;
    } else {
      // Build SVG bar chart
      const W = 280, H = 100, barW = 28, gap = 12;
      const total = points.length;
      const startX = 10;
      let bars = '';
      let labels = '';
      points.forEach((p, i) => {
        const x = startX + i * (barW + gap);
        const barH = p.reps > 0 ? Math.max(8, (p.reps / maxReps) * (H - 20)) : 0;
        const y = H - barH;
        const isToday = p.key === todayKey();
        bars += `<rect x="${x}" y="${y}" width="${barW}" height="${barH}" rx="6" fill="${isToday ? '#4f8ef7' : 'rgba(79,142,247,0.35)'}"/>`;
        if (p.reps > 0) bars += `<text x="${x+barW/2}" y="${y-4}" text-anchor="middle" font-size="9" fill="rgba(240,240,255,0.7)">${p.reps}</text>`;
        labels += `<text x="${x+barW/2}" y="${H+12}" text-anchor="middle" font-size="9" fill="rgba(240,240,255,0.4)">${p.day}</text>`;
      });
      chartContent = `<svg viewBox="0 0 ${startX*2 + total*(barW+gap)} ${H+20}" class="chart-svg">${bars}${labels}</svg>`;
    }

    card.innerHTML = `
      <div class="chart-title">${ex}</div>
      <div class="chart-sub">Wiederholungen pro Tag</div>
      <div class="chart-wrap">${chartContent}</div>`;
    container.appendChild(card);
  });
}

function buildPBs() {
  const rows = document.getElementById('pb-rows');
  rows.innerHTML = '';
  EXERCISES.forEach(ex => {
    let best = 0, bestSets = 0;
    Object.values(S.logs).forEach(log => {
      if (log[ex]) {
        if ((log[ex].reps || 0) > best) { best = log[ex].reps; bestSets = log[ex].sets; }
      }
    });
    rows.innerHTML += `
      <div class="pb-row">
        <span class="pb-ex">${ex}</span>
        ${best > 0
          ? `<span class="pb-val">${best} Wdh.</span><span class="pb-tag">${bestSets} Sets</span>`
          : `<span class="pb-tag">Noch kein Eintrag</span>`}
      </div>`;
  });
}

// ─── NAVIGATION ───
function navigate(screen) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('screen-' + screen).classList.add('active');
  document.getElementById('nav-' + screen).classList.add('active');
  if (screen === 'progress') renderProgress();
}

// ─── TOAST ───
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ─── INIT ───
renderHome();
